<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NetMapper Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0B0F14; --bar: #0E141B; --panel: #121820; --border: #1F2A35;
      --accent: #2DD4BF; --text: #E6EDF3; --muted: #8B98A5; --green: #22C55E;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 14px/1.45 'Inter', system-ui, -apple-system, sans-serif;
      display: flex; flex-direction: column; overflow: hidden;
    }

    /* ---------- üst bar ---------- */
    .topbar {
      flex: 0 0 54px; display: flex; align-items: center; gap: 20px;
      padding: 0 18px; background: var(--bar);
      border-bottom: 1px solid var(--border); z-index: 20;
    }
    .brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 16px; letter-spacing: .2px; }
    .brand svg { color: var(--accent); }
    .brand small {
      font-weight: 500; font-size: 11px; color: var(--muted);
      border: 1px solid var(--border); border-radius: 999px; padding: 2px 8px;
    }
    .tabs { display: flex; gap: 6px; margin: 0 auto; }
    .tab {
      appearance: none; border: 1px solid transparent; background: none;
      color: var(--muted); font: inherit; font-size: 13px; font-weight: 500;
      padding: 7px 16px; border-radius: 8px; cursor: pointer;
      transition: color .15s, background .15s, border-color .15s;
      display: flex; align-items: center; gap: 7px;
    }
    .tab:hover { color: var(--text); background: #131A22; }
    .tab.active { color: var(--text); background: var(--panel); border-color: var(--accent); box-shadow: 0 0 0 1px rgba(45,212,191,.15); }
    .tab.disabled { cursor: not-allowed; opacity: .45; }
    .tab.disabled:hover { color: var(--muted); background: none; }
    .status { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); }
    .status a { color: var(--accent); text-decoration: none; }
    .status a:hover { text-decoration: underline; }

    /* ---------- görünüm çerçevesi ---------- */
    main { flex: 1; position: relative; min-height: 0; }
    iframe {
      position: absolute; inset: 0; width: 100%; height: 100%;
      border: 0; display: none; background: var(--bg);
    }
    iframe.active { display: block; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"></path></svg>
      NetMapper <small>nmap · netdiscover · nikto</small>
    </div>
    <nav class="tabs">
      <button class="tab active" data-view="dashboard">📊 Dashboard</button>
      <button class="tab" data-view="yeni_tarama">⚡ Yeni Tarama</button>
      <button class="tab" data-view="ad_modulu">🛡 AD Keşif</button>
      <button class="tab" data-view="arp_guvenlik">🛰 ARP Güvenlik</button>
      <button class="tab" data-view="nac_modulu">🔓 NAC Delme</button>
      <button class="tab" data-view="host_envanteri">🖥 Envanter</button>
      <button class="tab disabled" title="yakında" disabled>📄 Raporlar</button>
      <button class="tab disabled" title="yakında" disabled>⚙ Ayarlar</button>
    </nav>
    <div class="status">
      <span class="dot" title="sunucu çevrimiçi"></span>
      <a href="/docs" target="_blank">API /docs</a>
    </div>
  </div>

  <main>
    <iframe id="v-dashboard"      class="active" src="/static/panels/dashboard.html"></iframe>
    <iframe id="v-yeni_tarama"   src="/static/panels/yeni_tarama.html"   loading="lazy"></iframe>
    <iframe id="v-ad_modulu"     src="/static/panels/ad_modulu.html"     loading="lazy"></iframe>
    <iframe id="v-arp_guvenlik"  src="/static/panels/arp_guvenlik.html"  loading="lazy"></iframe>
    <iframe id="v-nac_modulu"    src="/static/panels/nac_modulu.html"    loading="lazy"></iframe>
    <iframe id="v-host_envanteri" src="/static/panels/host_envanteri.html" loading="lazy"></iframe>
  </main>

  <script>
    "use strict";
    function show(view) {
      document.querySelectorAll(".tab[data-view]").forEach(t =>
        t.classList.toggle("active", t.dataset.view === view));
      document.querySelectorAll("iframe").forEach(f =>
        f.classList.toggle("active", f.id === "v-" + view));
    }
    document.querySelectorAll(".tab[data-view]").forEach(t =>
      t.addEventListener("click", () => {
        show(t.dataset.view);
        // panele her geçişte taze veri (yeni tarama/sonuçlar yansısın)
        const f = document.getElementById("v-" + t.dataset.view);
        const noRefresh = ["yeni_tarama", "ad_modulu", "arp_guvenlik", "nac_modulu"];
        if (!noRefresh.includes(t.dataset.view)) f.src = f.src;
      }));

    // Panellerden gelen navigasyon istekleri (data-go bağlantıları)
    window.addEventListener("message", (ev) => {
      if (ev.data && ev.data.go && document.querySelector(`.tab[data-view="${ev.data.go}"]`)) {
        show(ev.data.go);
        const f = document.getElementById("v-" + ev.data.go);
        const noRefresh = ["yeni_tarama", "ad_modulu", "arp_guvenlik", "nac_modulu"];
        if (!noRefresh.includes(ev.data.go)) f.src = f.src;
      }
    });
  </script>
<script src="/static/token.js"></script>
</body>
</html>
